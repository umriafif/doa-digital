<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doa Digital - Kumpulan Doa, Dzikir & Jadwal Sholat</title>
  
  <!-- font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="home.css">
</head>
<body>

  <!-- navbar search -->
  <header class="navbar">
    <div class="container nav-container">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Pencarian...">
      </div>
    </div>
  </header>

  <main class="container">

    <!-- card waktu sholat -->
    <section class="card-sholat">
      <div class="sholat-top">
        <div class="sholat-location">
          <span>Wilayah:</span>
          <select id="wilayahSelect">
            <option value="jakarta">Jakarta</option>
            <option value="bandung">Bandung</option>
            <option value="surabaya">Surabaya</option>
            <option value="yogyakarta">Yogyakarta</option>
            <option value="semarang">Semarang</option>
            <option value="medan">Medan</option>
            <option value="makassar">Makassar</option>
          </select>
        </div>
      </div>

      <div class="sholat-main">
        <div class="sholat-left">
          <div class="sholat-headline">
            <h2 id="nextPrayerName">Dzuhur</h2>
            <span class="sholat-highlight" id="nextPrayerTime">11:42 WIB</span>
          </div>
          <p class="sholat-desc" id="currentDateDisplay">Memuat tanggal...</p>
        </div>

        <div class="sholat-right">
          <span class="sholat-info-label">Countdown Sholat:</span>
          <div class="sholat-value" id="countdownDisplay">00:00:00</div>
          <div class="sholat-clock">
            Waktu Lokal: <span id="currentClockDisplay">00:00:00 WIB</span>
          </div>
        </div>
      </div>

      <div class="sholat-footer">
        <a href="jadwal.html" class="btn-sholat-action">Jadwal Lengkap</a>
      </div>
    </section>

    <!-- daftar menu  -->
    <section class="menu-cards">
      <a href="dzikir.html" class="menu-card">Dzikir Pilihan</a>
      <a href="jadwal.html" class="menu-card">Jadwal Sholat</a>
      <a href="favorit.html" class="menu-card">Doa Favorit</a>
    </section>

    <!-- daftar doa favorit -->
    <section class="fav-grid">
      <div class="fav-header">
        <h2 class="fav-title">Doa Favorit</h2>
        <a href="favorit.html" class="btn-fav">Lihat Semua</a>
      </div>

      <div class="fav-cards" id="favCardsContainer">
        <!-- list doa favorit dari script -->
      </div>
    </section>

    <!-- daftar doa dropdown -->
    <section class="list-doa" id="daftarDoaSection">
      <div class="list-doa-header">
        <div class="title-wrap">
          <h2 class="section-title">Daftar Doa</h2>
          <p class="section-desc">List doa yang tersedia.</p>
        </div>
        <div class="list-doa-actions">
          <span class="info-count" id="infoCount">Menampilkan 1-5 doa</span>
          <div class="accordion-toggle-wrap">
            <!-- <button id="btnExpandAll" type="button" class="btn-toggle-text">Buka Semua</button> -->
            <!-- <span class="toggle-sep">/</span>
            <button id="btnCollapseAll" type="button" class="btn-toggle-text">Tutup</button> -->
          </div>
          <a href="daftar_doa.html" class="btn-fav">Lihat Semua</a>
        </div>
      </div>

      <!-- list accordion dinamis -->
      <div class="simple-list" id="simpleList">
        <!-- Rendered dynamically by script.js -->
      </div>

      <!-- pagination dinamis -->
      <!-- <div class="pagination" id="paginationContainer"> -->
        <!-- Rendered dynamically by script.js -->
      <!-- </div> -->
    </section>

  </main>

  <!-- footer -->
  <footer class="footer">
    <div class="container">
      <p class="footer-copy">&copy; 2026 Doa Digital.</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
